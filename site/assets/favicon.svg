<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- LPAC Range Transfer: a robot (centre), its communication range (ring) and its graph neighbours -->
  <rect width="64" height="64" rx="14" fill="#0b6a70"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3" stroke-dasharray="5 4"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="17" y2="20"/>
    <line x1="32" y1="32" x2="47" y2="22"/>
    <line x1="32" y1="32" x2="44" y2="47"/>
    <line x1="17" y1="20" x2="47" y2="22"/>
  </g>
  <circle cx="17" cy="20" r="5.5" fill="#ffffff"/>
  <circle cx="47" cy="22" r="5.5" fill="#ffffff"/>
  <circle cx="44" cy="47" r="5.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="8" fill="#f2a541" stroke="#ffffff" stroke-width="3"/>
</svg>
